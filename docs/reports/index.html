<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel 下载中心</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:40px 20px}.title{font-size:30px;font-weight:800}.sub{color:#687386;margin:8px 0 24px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:18px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:20px;align-items:center}.name{font-weight:700}.tag{display:inline-block;padding:7px 12px;border-radius:8px;background:#eef2ff;color:#3150a7;font-weight:700;text-decoration:none}</style></head><body><div class="wrap"><div class="title">Excel 下载中心</div><div class="sub">尾盘预测与周度模型复盘文件。</div><div id="list">正在加载…</div></div><script>async function run(){const r=await fetch('./manifest.json?t='+Date.now(),{cache:'no-store'}).then(x=>x.json());const files=Array.isArray(r.files)?r.files:[];document.getElementById('list').innerHTML=files.length?files.map(x=>`<div class="card"><div class="row"><div><div class="name">${x.name}</div><div class="sub">${x.type||'Excel'}</div></div><a class="tag" href="${x.url}" download>下载 Excel</a></div></div>`).join(''):'<div class="card">暂无 Excel 文件</div>'}run().catch(e=>document.getElementById('list').textContent='加载失败：'+e.message)</script></body></html>
