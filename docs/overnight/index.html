<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隔夜复核</title><style>body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.title{font-size:28px;font-weight:800}.sub{color:#687386}.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:16px;margin:16px 0}.metric{font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px 12px;border-bottom:1px solid #e5e9f0;text-align:left;white-space:nowrap}th{color:#687386;background:#fafbfc}.table{overflow:auto}.up{color:#16834b;font-weight:800}.down{color:#b42318;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="title">② 隔夜复核 / 次日开盘前</div><div class="sub">独立网页 · 只复核上一交易日 15:30 → 次日 09:30 的新闻、公告和事件</div><div class="grid"><div class="card"><div>复核股票</div><div id="n" class="metric">—</div></div><div class="card"><div>新闻命中</div><div id="news" class="metric">—</div></div><div class="card"><div>升级 / 降级</div><div id="delta" class="metric">—</div></div></div><div class="card"><div id="meta"></div></div><div class="card"><div class="table"><table><thead><tr><th>#</th><th>股票</th><th>尾盘 Score</th><th>变化</th><th>开盘前 Score</th><th>状态</th><th>新闻</th><th>竞价状态</th></tr></thead><tbody id="body"></tbody></table></div></div><div class="card"><h3>事件详情</h3><div id="detail">—</div></div></div><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){const r=await fetch('../../data/preopen_review.json?t='+Date.now()).then(x=>x.json()),rows=Array.isArray(r.rows)?r.rows:[];$('n').textContent=rows.length;$('news').textContent=rows.reduce((a,x)=>a+Number(x.overnight_news_count||0),0);$('delta').textContent=rows.filter(x=>x.change_status==='UPGRADE').length+'/'+rows.filter(x=>x.change_status==='DOWNGRADE').length;$('meta').textContent=`复核窗口：${r.window_start_bj||'上一交易日15:30'} → ${r.window_end_bj||'次日09:30'} · 尾盘结果不被覆盖`;$('body').innerHTML=rows.length?rows.map((x,i)=>{const c=Number(x.score_change||0);return `<tr><td>${i+1}</td><td><b>${esc(x.name)}</b> ${esc(x.code)}</td><td>${Number(x.tail_score||0).toFixed(1)}</td><td class="${c>0?'up':c<0?'down':''}">${c>0?'+':''}${c.toFixed(1)}</td><td>${Number(x.preopen_score||0).toFixed(1)}</td><td>${esc(x.change_status||'UNCHANGED')}</td><td>${Number(x.overnight_news_count||0)}</td><td>${esc(x.auction_action||'WAIT_FOR_AUCTION')}</td></tr>`}).join(''):'<tr><td colspan="8">暂无隔夜复核</td></tr>';const news=[];rows.forEach(x=>(x.overnight_news||[]).forEach(z=>news.push({...z,stock:x.name,code:x.code})));$('detail').innerHTML=news.length?news.slice(0,50).map(x=>`<div style="padding:9px 0;border-bottom:1px dashed #e5e9f0"><b>${esc(x.stock)}</b> <span class="sub">${esc(x.code)} · ${esc(x.source)}</span><br><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>`).join(''):'暂无匹配事件'}run().catch(e=>$('meta').textContent='数据加载失败：'+e)</script></body></html>
