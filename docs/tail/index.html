<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尾盘趋势选股</title><style>body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1280px;margin:auto;padding:28px 18px}.title{font-size:28px;font-weight:800}.sub{color:#687386}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:24px;font-weight:800}.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:16px;margin:16px 0}table{border-collapse:collapse;width:100%;min-width:1260px}th,td{padding:10px 12px;border-bottom:1px solid #e5e9f0;text-align:left;white-space:nowrap}th{color:#687386;background:#fafbfc}.table{overflow:auto}.bad{color:#b42318;font-weight:800}.good{color:#16834b;font-weight:800}.tag{padding:2px 7px;border:1px solid #d8dee8;border-radius:999px;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="wrap"><div class="title">① 尾盘趋势选股</div><div class="sub">独立网页 · 全市场 → 主板/非ST → 价格≤50 → 流通市值20–300亿元 → 换手率&lt;10% → 量比代理&lt;5 → Top20。MA5/10/20/60、均线排列、量能与连续上涨只作为模型证据，不作为硬过滤。</div><div class="grid"><div class="card"><div>候选数</div><div id="n" class="metric">—</div></div><div class="card"><div>最高分</div><div id="top" class="metric">—</div></div><div class="card"><div>全市场股票</div><div id="raw" class="metric">—</div></div><div class="card"><div>硬过滤后</div><div id="eligible" class="metric">—</div></div></div><div class="card"><div id="status">正在加载数据…</div></div><div class="card"><div class="table"><table><thead><tr><th>#</th><th>股票</th><th>价格</th><th>涨幅</th><th>Score</th><th>等级</th><th>决策</th><th>量比代理</th><th>换手率</th><th>MA5</th><th>MA20</th><th>均线多头</th><th>MA5向上</th><th>连续上涨</th></tr></thead><tbody id="body"></tbody></table></div></div></div><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function getJSON(path){const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+path);return r.json()}async function run(){try{const[r,d]=await Promise.all([getJSON('../data/daily_candidates.json'),getJSON('../data/scan_diagnostics.json')]);$('n').textContent=r.length;$('top').textContent=r.length?Number(r[0].score).toFixed(1):'—';$('raw').textContent=d.raw_market_rows??'—';$('eligible').textContent=d.final_universe_rows??d.eligible_price_mcap_turnover_rows??'—';$('status').innerHTML=d.status==='OK'?'<span class="good">数据质量：OK</span>':'<span class="bad">数据质量：'+esc(d.status)+' · '+esc(d.blocking_reason||'')+'</span>';$('body').innerHTML=r.length?r.map((x,i)=>{const t=x.technical||{};return `<tr><td>${i+1}</td><td><b>${esc(x.name)}</b> ${esc(x.code)}</td><td>${Number(x.today_close||0).toFixed(2)}</td><td>${Number(x.today_change_pct||0).toFixed(2)}%</td><td><b>${Number(x.score||0).toFixed(1)}</b></td><td>${esc(x.grade)}</td><td>${esc(x.decision)}</td><td>${x.volume_ratio==null?'—':Number(x.volume_ratio).toFixed(2)}</td><td>${Number(x.turnover_rate_pct||0).toFixed(2)}%</td><td>${Number(t.ma5||0).toFixed(2)}</td><td>${Number(t.ma20||0).toFixed(2)}</td><td><span class="tag">${t.ma_bull_alignment?'是':'否'}</span></td><td><span class="tag">${t.ma5_rising?'是':'否'}</span></td><td>${Number(t.consecutive_up_days||0)}</td></tr>`}).join(''):'<tr><td colspan="14">暂无合格候选</td></tr>'}catch(e){$('status').innerHTML='<span class="bad">数据加载失败：'+esc(e.message)+'</span>';$('body').innerHTML='<tr><td colspan="14">请稍后刷新页面。</td></tr>'}}run()</script></body></html>
