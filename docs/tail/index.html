<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尾盘选股</title><style>body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.title{font-size:28px;font-weight:800}.sub{color:#687386}.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:24px;font-weight:800}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px 12px;border-bottom:1px solid #e5e9f0;text-align:left;white-space:nowrap}th{color:#687386;background:#fafbfc}.table{overflow:auto}.bad{color:#b42318;font-weight:800}.good{color:#16834b;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="title">① 尾盘选股</div><div class="sub">独立网页 · 全市场扫描 → 硬过滤 → Score Top20</div><div class="grid"><div class="card"><div>候选数</div><div id="n" class="metric">—</div></div><div class="card"><div>最高分</div><div id="top" class="metric">—</div></div><div class="card"><div>全市场股票</div><div id="raw" class="metric">—</div></div><div class="card"><div>最终过滤池</div><div id="elig" class="metric">—</div></div></div><div class="card"><div id="status"></div></div><div class="card"><div class="table"><table><thead><tr><th>#</th><th>股票</th><th>价格</th><th>涨幅</th><th>Score</th><th>等级</th><th>决策</th><th>5日线</th><th>量比代理</th><th>换手率</th></tr></thead><tbody id="body"></tbody></table></div></div></div><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){const [r,d]=await Promise.all([fetch('../../data/daily_candidates.json?t='+Date.now()).then(x=>x.json()),fetch('../../data/scan_diagnostics.json?t='+Date.now()).then(x=>x.json())]);$('n').textContent=r.length;$('top').textContent=r.length?Number(r[0].score).toFixed(1):'—';$('raw').textContent=d.raw_market_rows??'—';$('elig').textContent=d.final_filter_rows??d.eligible_rows??'—';$('status').innerHTML=d.status==='OK'?'<span class="good">数据质量：OK</span>':'<span class="bad">数据质量：'+esc(d.status)+' · '+esc(d.blocking_reason||'')+'</span>';$('body').innerHTML=r.length?r.map((x,i)=>{const f=x.features||{};return `<tr><td>${i+1}</td><td><b>${esc(x.name)}</b> ${esc(x.code)}</td><td>${Number(x.today_close||0).toFixed(2)}</td><td>${Number(x.today_change_pct||0).toFixed(2)}%</td><td><b>${Number(x.score||0).toFixed(1)}</b></td><td>${esc(x.grade)}</td><td>${esc(x.decision)}</td><td>${f.ma5_up?'向上':'—'}</td><td>${f.relative_volume??'—'}</td><td>${f.turnover_rate_pct??'—'}</td></tr>`}).join(''):'<tr><td colspan="10">暂无合格候选</td></tr>'}run().catch(e=>$('status').textContent='数据加载失败：'+e)</script></body></html>
