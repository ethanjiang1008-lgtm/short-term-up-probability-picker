<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>短线上涨概率选股</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px 18px 50px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px}.title{font-size:28px;font-weight:800}.sub,.note,.label{color:#687386}.badge{padding:6px 10px;border-radius:999px;background:#e8eefc;color:#2448b8;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.section{background:#fff;border:1px solid #e5e9f0;border-radius:14px}.card{padding:15px}.metric{font-size:22px;font-weight:800}.label,.note{font-size:12px}.section{margin:14px 0;overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid #e5e9f0;display:flex;justify-content:space-between}.head h2{font-size:17px;margin:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px 12px;border-bottom:1px solid #e5e9f0;text-align:left;white-space:nowrap}th{font-size:12px;color:#687386;background:#fafbfc}.up{color:#16834b;font-weight:800}.down{color:#c43d3d;font-weight:800}.neutral{color:#687386;font-weight:700}.tag{font-size:11px;padding:4px 7px;border-radius:999px;font-weight:800}.tag-a{background:#e6f6ed;color:#16834b}.tag-b{background:#eef2ff;color:#3150a7}.tag-c{background:#f0f1f3;color:#69717d}.tag-u{background:#e7f7ee;color:#16834b}.tag-d{background:#fdecec;color:#c43d3d}.detail{padding:14px 17px}.news{padding:8px 0;border-bottom:1px dashed #e5e9f0}.news a{color:#214fd0;text-decoration:none}.empty{padding:25px;color:#687386;text-align:center}.footer{margin-top:18px;color:#687386;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.hero{display:block}.title{font-size:24px}}</style></head><body><div class="wrap"><div class="hero"><div><div class="title">短线上涨概率选股</div><div class="sub">14:30 尾盘交易判断 → 15:30 至次日 09:30 隔夜复核</div></div><span class="badge">两份结果独立冻结</span></div><div class="grid"><div class="card"><div class="label">尾盘候选</div><div id="tailCount" class="metric">—</div></div><div class="card"><div class="label">尾盘最高分</div><div id="tailTop" class="metric">—</div></div><div class="card"><div class="label">隔夜新闻命中</div><div id="newsCount" class="metric">—</div></div><div class="card"><div class="label">开盘前升级 / 降级</div><div id="deltaCount" class="metric">—</div></div></div><section class="section"><div class="head"><h2>① 14:30 尾盘交易判断</h2><span id="tailMeta" class="note">冻结快照</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>股票</th><th>涨幅</th><th>Score</th><th>等级</th><th>决策</th><th>基础</th><th>尾盘</th><th>板块</th><th>市场</th></tr></thead><tbody id="tailBody"></tbody></table></div></section><section class="section"><div class="head"><h2>② 15:30 → 次日 09:30 隔夜复核</h2><span id="reviewMeta" class="note">独立结果，不覆盖尾盘</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>股票</th><th>尾盘 Score</th><th>变化</th><th>开盘前 Score</th><th>变化状态</th><th>隔夜新闻</th><th>竞价</th></tr></thead><tbody id="reviewBody"></tbody></table></div></section><section class="section"><div class="head"><h2>隔夜重要新闻</h2><span class="note">仅展示与尾盘候选匹配的信息</span></div><div id="newsList" class="detail"></div></section><section class="section"><div class="head"><h2>历史研究</h2><span class="note">Score 不是概率；概率需真实样本校准</span></div><div id="research" class="detail"></div></section><div class="footer">数据来自仓库每日快照。新闻属于事件发现层，正式交易前应核验公司公告/交易所披露。</div></div><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(p){const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.json()}function pct(x){return x==null?'—':(Number(x)*100).toFixed(1)+'%'}function grade(g){return `<span class="tag tag-${String(g||'').toLowerCase()}">${esc(g||'—')}</span>`}function status(s){let c=s==='UPGRADE'?'tag-u':s==='DOWNGRADE'?'tag-d':'tag-c';return `<span class="tag ${c}">${esc(s||'UNCHANGED')}</span>`}async function main(){try{const[t,r,b]=await Promise.all([get('data/daily_candidates.json'),get('data/preopen_review.json'),get('data/backtest_report.json')]),tails=Array.isArray(t)?t:[],rows=Array.isArray(r.rows)?r.rows:[];const n=rows.reduce((a,x)=>a+Number(x.overnight_news_count||0),0),u=rows.filter(x=>x.change_status==='UPGRADE').length,d=rows.filter(x=>x.change_status==='DOWNGRADE').length;$('tailCount').textContent=tails.length;$('tailTop').textContent=tails.length?Number(tails[0].score).toFixed(1):'—';$('newsCount').textContent=n;$('deltaCount').textContent=u+'/'+d;$('tailMeta').textContent=(tails[0]?.date||'—')+' · 14:30 快照';$('reviewMeta').textContent='窗口 15:30 → 次日 09:30';$('tailBody').innerHTML=tails.length?tails.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b> <span class="note">${esc(x.code)}</span></td><td>${Number(x.today_change_pct||0).toFixed(2)}%</td><td><b>${Number(x.score||0).toFixed(1)}</b></td><td>${grade(x.grade)}</td><td>${esc(x.decision)}</td><td>${Number(x.components?.base_strength||0).toFixed(0)}</td><td>${Number(x.components?.close_strength||0).toFixed(0)}</td><td>${Number(x.components?.sector_strength||0).toFixed(0)}</td><td>${Number(x.components?.market_environment||0).toFixed(0)}</td></tr>`).join(''):'<tr><td colspan="10" class="empty">暂无尾盘数据</td></tr>';$('reviewBody').innerHTML=rows.length?rows.map((x,i)=>{const c=Number(x.score_change||0);return `<tr><td>${i+1}</td><td><b>${esc(x.name)}</b> <span class="note">${esc(x.code)}</span></td><td>${Number(x.tail_score||0).toFixed(1)}</td><td class="${c>0?'up':c<0?'down':'neutral'}">${c>0?'+':''}${c.toFixed(1)}</td><td><b>${Number(x.preopen_score||0).toFixed(1)}</b></td><td>${status(x.change_status)}</td><td>${Number(x.overnight_news_count||0)}</td><td>${esc(x.auction_action||'WAIT_FOR_AUCTION')}</td></tr>`}).join(''):'<tr><td colspan="8" class="empty">暂无隔夜复核数据</td></tr>';const news=[];rows.forEach(x=>(x.overnight_news||[]).forEach(z=>news.push({...z,stock:x.name,code:x.code})));$('newsList').innerHTML=news.length?news.slice(0,30).map(x=>`<div class="news"><b>${esc(x.stock)}</b> <span class="note">${esc(x.code)} · ${esc(x.source)}</span><br><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>`).join(''):'<div class="empty">暂无匹配新闻</div>';const e=b.thresholds||{},it=Object.entries(e);$('research').innerHTML=`<div>已标注样本：<b>${Number(b.labeled_samples||0)}</b> · 最低可靠样本数：<b>${Number(b.min_samples||0)}</b> · 当前最佳阈值：<b>${b.best_threshold_by_expectancy??'尚无'}</b></div>`+(it.length?`<table style="min-width:0;margin-top:10px"><thead><tr><th>阈值</th><th>样本</th><th>上涨率</th><th>平均收益</th><th>期望收益</th></tr></thead><tbody>${it.map(([k,v])=>`<tr><td>${k}</td><td>${v.samples}</td><td>${pct(v.win_rate)}</td><td>${pct(v.avg_return)}</td><td>${pct(v.expectancy)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无足够历史样本</div>')}catch(e){console.error(e);document.querySelectorAll('tbody').forEach(x=>x.innerHTML='<tr><td colspan="10" class="empty">数据暂不可用，请稍后刷新</td></tr>')}}main();</script></body></html>
