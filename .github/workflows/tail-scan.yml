name: Tail Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tail-scan.yml'
      - 'scripts/market_data_sina.py'
      - 'scripts/scanner.py'
      - 'scripts/features.py'
      - 'scripts/labels.py'
      - 'scripts/history.py'
      - 'scripts/report.py'
      - 'scripts/daily_pipeline.py'
      - 'scripts/tests/**'
  schedule:
    # 14:30 Beijing = 06:30 UTC.
    # 14:30 is the execution trigger; data is not artificially truncated to 14:30.
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest scripts/tests -q
      - name: Run tail scan, label history and report
        run: |
          python scripts/daily_pipeline.py
          python scripts/label_history.py
          python scripts/report.py
      - name: Commit frozen tail snapshot and research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/daily_candidates.json data/backtest_report.json data/scan_diagnostics.json
          if [ -d data/history ]; then
            git add -f data/history
          fi
          git diff --cached --quiet || git commit -m "data: update tail scan, diagnostics and history"
          git push

      # Push-triggered runs provide a deterministic bootstrap after CI/config fixes;
      # scheduled runs remain the production 14:30 Beijing snapshot.
