name: Tail Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tail-scan.yml'
  schedule:
    # 14:30 Beijing = 06:30 UTC.
    # This is intentionally before the close so high-confidence names can be acted on in the late session.
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest scripts/tests -q
      - name: Run tail scan, label history and report
        run: |
          python scripts/daily_pipeline.py
          python scripts/label_history.py
          python scripts/report.py
      - name: Commit frozen tail snapshot and research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/daily_candidates.json data/history data/backtest_report.json
          git diff --cached --quiet || git commit -m "data: update 14:30 tail scan and history"
          git push
