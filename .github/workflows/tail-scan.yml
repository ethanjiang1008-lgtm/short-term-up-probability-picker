name: Tail Scan

on:
  workflow_dispatch:
  schedule:
    # 15:25 Beijing = 07:25 UTC
    - cron: "25 7 * * 1-5"

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest scripts/tests -q
      - name: Run tail scan and save snapshot
        run: python scripts/daily_pipeline.py
      - name: Commit tail snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_candidates.json data/history || true
          git diff --cached --quiet || git commit -m "chore: update tail candidates"
          git push
