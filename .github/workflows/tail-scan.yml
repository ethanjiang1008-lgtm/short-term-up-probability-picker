name: A股-尾盘趋势选股

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"
  push:
    branches: [main]
    paths:
      - '.github/workflows/tail-scan.yml'
      - 'scripts/market_data_sina.py'
      - 'scripts/scanner.py'
      - 'scripts/features.py'
      - 'scripts/labels.py'
      - 'scripts/history.py'
      - 'scripts/report.py'
      - 'scripts/daily_pipeline.py'
      - 'scripts/tests/**'

permissions:
  contents: write

concurrency:
  group: tail-scan
  cancel-in-progress: true

jobs:
  tail-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest scripts/tests -q
      - name: Run tail scan and research update
        run: |
          python scripts/daily_pipeline.py
          python scripts/label_history.py
          python scripts/report.py
      - name: Commit tail-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/daily_candidates.json data/backtest_report.json data/scan_diagnostics.json
          if [ -d data/history ]; then git add -f data/history; fi
          git diff --cached --quiet || git commit -m "data: update tail trend selection"
          git pull --rebase origin main
          git push
