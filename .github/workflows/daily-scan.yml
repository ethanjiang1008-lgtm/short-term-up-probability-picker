name: Daily Tail Scanner

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest scripts/tests -q
      - name: Run scanner
        run: python scripts/scanner.py --output data/daily_candidates.json
      - name: Upload candidate snapshot
        uses: actions/upload-artifact@v4
        with:
          name: daily-candidates
          path: data/daily_candidates.json
