name: A股-连板启动规律挖掘

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/limitup_pattern_miner.py'
      - '.github/workflows/limitup-pattern-mining.yml'

permissions:
  contents: write

concurrency:
  group: limitup-pattern-mining
  cancel-in-progress: true

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Mine startup patterns
        run: python scripts/limitup_pattern_miner.py
      - name: Commit mining result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/pattern_mining
          git diff --cached --quiet || git commit -m 'data: update limit-up startup patterns'
          git pull --rebase origin main
          git push
