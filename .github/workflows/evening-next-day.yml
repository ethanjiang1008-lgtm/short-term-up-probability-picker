name: A股-隔夜事件复核

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: overnight-review
  cancel-in-progress: true

jobs:
  overnight-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest scripts/tests -q
      - name: Build overnight review only
        run: python scripts/next_day_update.py
      - name: Commit overnight-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/overnight_news.json data/preopen_review.json
          git diff --cached --quiet || git commit -m "data: update overnight event review"
          git push
