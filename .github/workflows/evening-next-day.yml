name: Evening News and Next-Day Update

on:
  workflow_dispatch:
  schedule:
    # 20:30 Beijing = 12:30 UTC; evening news crawl
    - cron: "30 12 * * 1-5"
    # 08:45 Beijing = 00:45 UTC; refresh pre-open decision state
    - cron: "45 0 * * 1-5"

jobs:
  evening-next-day:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest scripts/tests -q
      - name: Crawl evening news and match tail candidates
        run: python scripts/news_crawler.py
      - name: Commit news snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evening_news.json || true
          git diff --cached --quiet || git commit -m "chore: update evening news radar"
          git push
