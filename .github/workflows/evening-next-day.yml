name: Evening News and Next-Day Update

on:
  workflow_dispatch:
  schedule:
    # 20:30 Beijing = 12:30 UTC
    - cron: "30 12 * * 1-5"
    # 08:45 Beijing = 00:45 UTC
    - cron: "45 0 * * 1-5"

permissions:
  contents: write

jobs:
  evening-next-day:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest scripts/tests -q
      - name: Run second-stage update
        run: |
          HOUR=$(TZ=Asia/Shanghai date +%H)
          if [ "$HOUR" -ge 18 ]; then
            echo "Evening phase: crawl public news and announcements."
            python scripts/news_crawler.py
          else
            echo "Pre-open phase: reuse the latest evening news snapshot."
          fi
          python scripts/next_day_update.py
      - name: Commit second-stage data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/evening_news.json data/next_day_watch.json
          git diff --cached --quiet || git commit -m "data: update evening news and next-day watch"
          git push
