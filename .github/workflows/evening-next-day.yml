name: Overnight Review and Pre-Open Update

on:
  workflow_dispatch:
  schedule:
    # 09:30 Beijing = 01:30 UTC. The review covers previous day 15:30 -> today 09:30.
    # This workflow does not claim to have auction data unless a verified auction source is added.
    - cron: "30 1 * * 1-5"

permissions:
  contents: write

jobs:
  overnight-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest scripts/tests -q
      - name: Crawl overnight news and build pre-open review
        run: python scripts/next_day_update.py
      - name: Commit pre-open review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/overnight_news.json data/preopen_review.json
          git diff --cached --quiet || git commit -m "data: update overnight review and pre-open snapshot"
          git push
