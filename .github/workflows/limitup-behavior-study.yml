name: A股-连板启动前行为研究（独立）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/limitup_behavior_study.py'
      - '.github/workflows/limitup-behavior-study.yml'

permissions:
  contents: write

concurrency:
  group: limitup-behavior-study
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run standalone behavior study
        run: python scripts/limitup_behavior_study.py
      - name: Commit study result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/limitup_behavior_study
          git diff --cached --quiet || git commit -m 'data: update standalone limit-up behavior study'
          git pull --rebase origin main
          git push
