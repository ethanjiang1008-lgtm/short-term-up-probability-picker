name: Publish Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/daily_candidates.json'
      - 'data/preopen_review.json'
      - 'data/overnight_news.json'
      - 'data/backtest_report.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp -r docs/* _site/
          for f in daily_candidates.json preopen_review.json overnight_news.json backtest_report.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
