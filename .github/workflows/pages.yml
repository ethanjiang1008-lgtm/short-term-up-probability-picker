name: 发布A股独立结果页面

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/daily_candidates.json'
      - 'data/preopen_review.json'
      - 'data/overnight_news.json'
      - 'data/backtest_report.json'
      - 'data/scan_diagnostics.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare independent pages
        run: |
          rm -rf _site
          mkdir -p _site/tail _site/overnight _site/data
          cp docs/index.html _site/index.html
          cp docs/tail/index.html _site/tail/index.html
          cp docs/overnight/index.html _site/overnight/index.html
          for f in daily_candidates.json scan_diagnostics.json backtest_report.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
          for f in preopen_review.json overnight_news.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
