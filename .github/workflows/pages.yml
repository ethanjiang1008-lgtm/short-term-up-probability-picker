name: 发布A股独立结果页面

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/daily_candidates.json'
      - 'data/backtest_report.json'
      - 'data/scan_diagnostics.json'
      - 'data/validation/**'
      - 'reports/weekly_model_review.json'
      - 'reports/*.xlsx'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare tail page only
        run: |
          rm -rf _site
          mkdir -p _site/tail _site/data/validation _site/reports
          cp docs/index.html _site/index.html
          cp docs/tail/index.html _site/tail/index.html
          for f in daily_candidates.json scan_diagnostics.json backtest_report.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
          if [ -f data/validation/latest_validation.json ]; then cp data/validation/latest_validation.json _site/data/validation/latest_validation.json; fi
          if [ -f reports/weekly_model_review.json ]; then cp reports/weekly_model_review.json _site/reports/weekly_model_review.json; fi
          for f in reports/*.xlsx; do
            [ -f "$f" ] && cp "$f" _site/reports/ || true
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
